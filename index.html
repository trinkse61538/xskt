<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XSKT V5.1">
  <meta name="description" content="V5.1 XSKT 2026–2030: hôm nay, 4 ngày chính và toàn bộ lịch theo dõi.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/style.css">
  <title>XSKT V5.1</title>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div>
      <div class="eyebrow">XSKT · V5.1</div>
      <h1 id="screenTitle">Hôm nay</h1>
    </div>
    <button id="installBtn" class="icon-btn install-mini" hidden aria-label="Cài ứng dụng">＋</button>
  </header>

  <main class="app-main">
    <!-- TODAY -->
    <section id="screen-today" class="screen active">
      <div id="todayContent"></div>
    </section>

    <!-- MAIN DAYS -->
    <section id="screen-main" class="screen">
      <div class="period-toolbar">
        <button id="mainPrev" class="round-btn" aria-label="Tháng trước">‹</button>
        <button id="mainPeriod" class="period-label"></button>
        <button id="mainNext" class="round-btn" aria-label="Tháng sau">›</button>
      </div>
      <div class="screen-intro">
        <strong>4 ngày ưu tiên</strong>
        <span>Được chọn theo Priority = 65% V5 + 35% Agreement, giãn tối thiểu 5 ngày.</span>
      </div>
      <div id="mainDays" class="day-list"></div>
    </section>


    <!-- CALENDAR -->
    <section id="screen-calendar" class="screen">
      <div class="period-toolbar">
        <button id="calPrev" class="round-btn" aria-label="Tháng trước">‹</button>
        <button id="calPeriod" class="period-label"></button>
        <button id="calNext" class="round-btn" aria-label="Tháng sau">›</button>
      </div>
      <div class="calendar-legend">
        <span><i class="legend-dot main"></i>Chính</span>
        <span><i class="legend-dot pa"></i>Phụ A</span>
        <span><i class="legend-dot pb"></i>Phụ B</span>
        <span><i class="legend-dot pc"></i>Phụ C</span>
      </div>
      <div class="weekday-row">
        <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <div class="calendar-note">Số lớn: ngày dương · số nhỏ: ngày âm. Bấm vào ngày để xem chi tiết.</div>
    </section>

    <!-- ALL DAYS -->
    <section id="screen-all" class="screen">
      <div class="filter-card">
        <div class="filter-row">
          <select id="allYear" aria-label="Năm"></select>
          <select id="allMonth" aria-label="Tháng"></select>
        </div>
        <div class="segmented" id="allType">
          <button data-type="ALL" class="active">Tất cả</button>
          <button data-type="CHÍNH">Chính</button>
          <button data-type="PHỤ A">Phụ A</button>
          <button data-type="PHỤ B">Phụ B</button>
          <button data-type="PHỤ C">Phụ C</button>
        </div>
        <input id="allSearch" type="search" placeholder="Tìm số, Can-Chi, quẻ…">
      </div>
      <div id="allSummary" class="summary-line"></div>
      <div id="allDays" class="day-list compact-list"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Điều hướng chính">
    <button data-screen="today" class="active">
      <span class="nav-icon">⌾</span><span>Hôm nay</span>
    </button>
    <button data-screen="main">
      <span class="nav-icon">★</span><span>4 ngày chính</span>
    </button>
    <button data-screen="calendar">
      <span class="nav-icon">▦</span><span>Lịch tháng</span>
    </button>
    <button data-screen="all">
      <span class="nav-icon">☷</span><span>Tất cả ngày</span>
    </button>
  </nav>

  <!-- DETAIL SHEET -->
  <div id="detailOverlay" class="detail-overlay" hidden>
    <div class="detail-backdrop" data-close-detail></div>
    <article class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div>
          <div id="detailMeta" class="eyebrow"></div>
          <h2 id="detailTitle"></h2>
        </div>
        <button class="icon-btn" data-close-detail aria-label="Đóng">×</button>
      </div>
      <div id="detailBody"></div>
    </article>
  </div>

  <aside id="iosInstallHint" class="ios-hint" hidden>
    <button class="hint-close" id="closeIosHint">×</button>
    <strong>Cài app trên iPhone</strong>
    <span>Safari → Chia sẻ → Thêm vào Màn hình chính.</span>
  </aside>
</div>

<script src="./data/v51-2026-2030.js"></script>
<script src="./assets/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(console.error));
}
</script>
</body>
</html>
