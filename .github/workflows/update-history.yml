name: Update XSMN History

on:
  schedule:
    # 18:45 Vietnam (UTC+7) = 11:45 UTC
    - cron: "45 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-history.txt
      - name: Fetch missing draws
        run: python scripts/update_history.py
      - name: Rebuild Recent Form
        run: python scripts/build_recent_stats.py
      - name: Commit updated history
        run: |
          git config user.name "xskt-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update XSMN historical data"
            git push
          fi
